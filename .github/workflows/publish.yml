name: publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/codebase-brief
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - name: Smoke-test the built wheel in a clean environment
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python -m venv .release-venv
          .release-venv/bin/python -m pip install --no-deps dist/*.whl
          .release-venv/bin/python - <<'PY'
          import importlib.metadata
          import os
          import subprocess

          expected = os.environ["RELEASE_TAG"].removeprefix("v")
          actual = importlib.metadata.version("codebase-brief")
          if actual != expected:
              raise SystemExit(f"Release tag says {expected}, but wheel is {actual}")
          subprocess.run([".release-venv/bin/codebase-brief", "--help"], check=True, stdout=subprocess.DEVNULL)
          subprocess.run([".release-venv/bin/brief", "--version"], check=True)
          PY
      - name: Publish package
        uses: pypa/gh-action-pypi-publish@release/v1
