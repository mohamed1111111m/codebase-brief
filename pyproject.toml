[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "codebase-brief"
version = "0.1.4"
description = "Local-first CLI that builds task-focused context briefs from code repositories"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Mohamed Maggy"}]
requires-python = ">=3.10"
dependencies = []
keywords = ["developer-tools", "codebase", "context", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]

[project.urls]
Homepage = "https://mohamed1111111m.github.io/codebase-brief/"
Repository = "https://github.com/mohamed1111111m/codebase-brief"
Issues = "https://github.com/mohamed1111111m/codebase-brief/issues"

[project.scripts]
brief = "context_inject.cli:main"
codebase-brief = "context_inject.cli:main"
context-inject = "context_inject.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["context_inject*"]

